<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="description" content="">
		<meta name="author" content="">
		<title>Regal Calendar SQL</title>
		<link rel="stylesheet" href="css/bootstrap.min.css">
		<link rel="stylesheet" href="css/font-awesome.min.css">
		<link rel="stylesheet" href="css/jquery.dataTables.css">
		<link rel="stylesheet" href="css/dataTables.bootstrap.css">
		<link rel="stylesheet" href="css/bootstrap-datetimepicker.min.css">
		<link rel="stylesheet" href="css/fontawesome-iconpicker.css">
		<link rel="stylesheet" href="css/jquery.fileupload.css">
		<link rel="stylesheet" href="css/grid.css">
		<script src="http://maps.googleapis.com/maps/api/js?libraries=places"></script>
		<script src="js/lib/require.js"></script>
		<script src="js/lib/grid.js"></script>
		
	</head>
	<body id="page-top">
		<nav id="mainNav" class="navbar navbar-default navbar-fixed-top">
			<div class="container-fluid">
				<div class="navbar-header">
					<button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
						<span class="sr-only">Toggle navigation</span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
					</button>
					<a class="navbar-brand page-scroll" href="#page-top">Regal Calendar SQL</a>
				</div>
			</div>
		</nav>
		<section>
			<div class="container">
				<div class="row">
					<div class="col-lg-12 text-center">
						<h4 class="section-heading">Events list</h4>
						<hr class="primary">
						<table id="grid" class="display" cellspacing="0" width="100%">
							<thead>
								<tr>
									<th>id</th>
									<th>date</th>
									<th>time</th>
									<th>icon</th>
									<th>title</th>
									<th>text</th>
									<th>location</th>
									<th>previewText</th>
									<th>cityWeather</th>
									<th></th>
								</tr>
							</thead>
						</table>
						<div class="actions">
							<div class="upload">
								<button class="btn btn-primary" id="new">
									<i class="fa fa-plus "></i>
									<span>Add event</span>
								</button>
								<span class="btn btn-success fileinput-button">
									<i class="fa fa-cloud-upload "></i>
									<span>Import</span>
									<!-- The file input field used as target for the file upload widget -->
									<input id="fileupload" type="file" name="files">
								</span>
								<br>
								<br>
								<!-- The global progress bar -->
								<div id="progress" class="progress">
									<div class="progress-bar progress-bar-success"></div>
								</div>
								<!-- The container for the uploaded files -->
								<div id="files" class="files"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<div class="modal fade" id="eventModal" tabindex="-1" role="dialog">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title" id="myModalLabel">Event</h4>
					</div>
					<div class="modal-body">
						<form>
							<div class="row">
								<div class="col-md-6">
									<div class='input-group date' id='date'>
										<input type='text' class="form-control" placeholder="date" />
										<span class="input-group-addon">
											<span class="fa fa-calendar"></span>
										</span>
									</div>
								</div>
								<div class="col-md-6">
									<div class='input-group icon'>
										<input type="text" class="form-control icon" name="icon" id="icon" placeholder="icon" value="fa-adjust">
										<span class="input-group-addon">
											<span class="fa fa-picture"></span>
										</span>
									</div>
								</div>
							</div>
							<div class='input-group title'>
								<input type="text" class="form-control icon" name="title" id="title" placeholder="title">
								<span class="input-group-addon">
									<span class="fa fa-header"></span>
								</span>
							</div>
							<div class='input-group location'>
								<input type="text" class="form-control icon" name="location" id="location" placeholder="location">
								<span class="input-group-addon">
									<span class="fa fa-globe"></span>
								</span>
							</div>
							<div class="row">
								<div class="col-md-6">
									<div class='input-group weather'>
										<input type="text" class="form-control icon" name="cityWeather" id="weather" placeholder="city weather">
										<span class="input-group-addon">
											<span class="fa fa-cloud"></span>
										</span>
									</div>
								</div>
								<div class="col-md-6">
									<div class='input-group preview'>
										<input type="text" class="form-control icon" name="previewText" id="preview" placeholder="preview text">
										<span class="input-group-addon">
											<span class="fa fa-navicon"></span>
										</span>
									</div>
								</div>
							</div>
							<div class='input-group text'>
								<textarea id="text"></textarea>
							</div>
							<input type="hidden" id="rDate" name="date">
							<input type="hidden" id="rTime" name="hour">
						</form>
					</div>
					<div class="modal-footer">
						<img src="img/loader.gif" alt="loader" class="img-loader"/>
						<button type="button" class="btn btn-primary" data-dismiss="modal">
							<i class="fa fa-remove"></i>Close</button>
						<button type="button" class="btn btn-primary" id="save">
							<i class="fa fa-check"></i>Save</button>
					</div>
				</div>
			</div>
		</div>
		<div class="modal fade" id="infoModal" tabindex="-1" role="dialog">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title" id="myModalLabel">Send reminders</h4>
					</div>
					<div class="modal-body">
						<p>No subscribers found</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" data-dismiss="modal">
							<i class="fa fa-remove"></i>Close</button>
					</div>
				</div>
			</div>
		</div>
		<div class="modal fade" id="eventDeleteModal" tabindex="-1" role="dialog">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title" id="myModalLabel">Delete Event</h4>
					</div>
					<div class="modal-body">
						<p>Confirm delete event?</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" data-dismiss="modal">
							<i class="fa fa-remove"></i>Close</button>
						<button type="button" class="btn btn-danger" id="delete">
							<i class="fa fa-check"></i>Yes</button>
					</div>
				</div>
			</div>
		</div>
		<div class="modal fade" id="subscriptionsModal" tabindex="-1" role="dialog">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title" id="myModalLabel">Send reminders</h4>
						<span class="badge"></span>
					</div>
					<div class="modal-body"></div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" data-dismiss="modal">
							<i class="fa fa-remove"></i>Close</button>
						<button type="button" class="btn btn-danger" id="send">
							<i class="fa fa-check"></i>Send</button>
							<input type="hidden" id="tk" />
					</div>
				</div>
			</div>
		</div>
		<div id="loader">
			<img src="img/loader.gif">
		</div>
	</body>

</html>
